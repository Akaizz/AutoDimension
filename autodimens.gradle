//./gradlew :autodimens:createDimension
abstract class DimensionFactory extends DefaultTask {

    @Input
    List<Integer> dimens = []
    @Input
    int fromDimension = 360
    @Input
    double positiveMaxDP = 600
    @Input
    double negativeMaxDP = 600
    @Input
    double positiveMaxSP = 60

    @Internal
    File resDir

    @TaskAction
    def create() {
        autoCreateDimen();
    }

    def autoCreateDimen() {
        for (int dimen : dimens) {
            String folderName = "";
            String dimenFileName = "";
            if (dimen == 0) {
                dimen = fromDimension
                folderName = "values"
                dimenFileName = "\t<string name=\"dimenFileName\">values-default</string>"
            } else {
                folderName = "values-sw" + (int) dimen + "dp";
                dimenFileName = "\t<string name=\"dimenFileName\">" + folderName + "</string>"
            }
            String folder = resDir.path + "/" + folderName
            String fileName = folder + "/auto_dimens.xml";
            new File(folder).mkdirs();
            new File(fileName).createNewFile();
            PrintWriter printWriter = new PrintWriter(fileName);
            printWriter.println("<?xml version=\"1.0\" encoding=\"utf-8\"?>");
            printWriter.println("<resources>");
            printWriter.println(dimenFileName);

            double ratio = dimen / fromDimension;
            double haftDp = ratio * 0.5;

            printWriter.printf("\t<dimen name=\"_0_5dp\">%.2fdp</dimen>\n", haftDp);
            for (int i = 1; i <= positiveMaxDP; i++) {
                double dp = ratio * i;
                printWriter.printf("\t<dimen name=\"_%ddp\">%.2fdp</dimen>\n", i, dp);
                printWriter.printf("\t<dimen name=\"_%d_5dp\">%.2fdp</dimen>\n", i, dp + haftDp);
            }

            printWriter.printf("\t<dimen name=\"minus_0_5dp\">%.2fdp</dimen>\n", -haftDp);
            for (int i = 1; i <= negativeMaxDP; i++) {
                double dp = ratio * i;
                printWriter.printf("\t<dimen name=\"minus_%ddp\">%.2fdp</dimen>\n", i, -dp);
                printWriter.printf("\t<dimen name=\"minus_%d_5dp\">%.2fdp</dimen>\n", i, -dp - haftDp);
            }

            for (int i = 1; i <= positiveMaxSP; i++) {
                double sp = ratio * i;
                printWriter.printf("\t<dimen name=\"_%dsp\">%.2fsp</dimen>\n", i, sp);
            }

            printWriter.println("</resources>");
            printWriter.close();
        }
    }
}

tasks.register("createDimension", DimensionFactory) {
    group = "autodimens"
    description = "Generates values-swXXXdp/auto_dimens.xml for every smallest-width bucket."
    resDir = file("src/main/res")
    dimens = [0, 320, 360, 384, 390, 400, 411, 420, 433, 450, 480, 533, 540, 561, 600, 640, 673, 681, 720, 768, 800, 840, 886, 960, 1024, 1080, 1280, 1366, 1440, 1600, 1920, 2560, 3840]
    fromDimension = 360
    positiveMaxDP = 600
    negativeMaxDP = 600
    positiveMaxSP = 60
}
